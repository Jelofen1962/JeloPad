name: Build JeloPad

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # WINDOWS x64
  # ============================================================

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: pygame
          python -m pip install websockets textual rich hidapi pyinstaller

      - name: Verify Python dependencies
        shell: bash
        run: |
          python -c "import pygame; print('pygame:', pygame.version.ver)"
          python -c "import websockets; print('websockets: OK')"
          python -c "import textual; print('textual: OK')"
          python -c "import rich; print('rich: OK')"
          python -c "import hid; print('hidapi: OK')"

      - name: Build Windows executable
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name "JeloPad-Windows-x64" \
            --collect-all pygame \
            --collect-all textual \
            --collect-all rich \
            cli.py

      - name: Verify Windows executable
        shell: bash
        run: |
          test -f "dist/JeloPad-Windows-x64.exe"
          ls -lh "dist/JeloPad-Windows-x64.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: JeloPad-Windows-x64
          path: dist/JeloPad-Windows-x64.exe


  # ============================================================
  # LINUX x64
  # ============================================================

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            fuse \
            libfuse2

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: pygame
          python -m pip install websockets textual rich hidapi pyinstaller

      - name: Verify Python dependencies
        run: |
          python -c "import pygame; print('pygame:', pygame.version.ver)"
          python -c "import websockets; print('websockets: OK')"
          python -c "import textual; print('textual: OK')"
          python -c "import rich; print('rich: OK')"
          python -c "import hid; print('hidapi: OK')"

      # ----------------------------------------------------------
      # Build standalone Linux binary
      # ----------------------------------------------------------

      - name: Build Linux executable
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name "JeloPad-Linux-x64" \
            --collect-all pygame \
            --collect-all textual \
            --collect-all rich \
            cli.py

      - name: Verify Linux executable
        run: |
          test -f "dist/JeloPad-Linux-x64"
          chmod +x "dist/JeloPad-Linux-x64"

          file "dist/JeloPad-Linux-x64"
          ls -lh "dist/JeloPad-Linux-x64"

      # ----------------------------------------------------------
      # Create AppImage directory
      # ----------------------------------------------------------

      - name: Create AppImage structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          # Copy executable
          cp dist/JeloPad-Linux-x64 AppDir/usr/bin/JeloPad
          chmod +x AppDir/usr/bin/JeloPad

          # ------------------------------------------------------
          # Create JeloPad icon
          # ------------------------------------------------------

          cat > AppDir/usr/share/icons/hicolor/scalable/apps/jelopad.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#111111"/>
            <rect
              x="42"
              y="72"
              width="172"
              height="112"
              rx="40"
              fill="none"
              stroke="#ffffff"
              stroke-width="14"
            />
            <circle cx="174" cy="112" r="10" fill="#ffffff"/>
            <circle cx="199" cy="132" r="10" fill="#ffffff"/>
            <path
              d="M78 128h48M102 104v48"
              stroke="#ffffff"
              stroke-width="12"
              stroke-linecap="round"
            />
          </svg>
          EOF

          # ------------------------------------------------------
          # Create desktop file
          #
          # IMPORTANT:
          # appimagetool requires this at AppDir root.
          # ------------------------------------------------------

          cat > AppDir/jelopad.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=JeloPad
          GenericName=JeloPad
          Comment=JeloPad PS4 controller bridge
          Exec=JeloPad
          Icon=jelopad
          Terminal=true
          Categories=Utility;
          EOF

          # Also place it in the standard applications directory
          cp \
            AppDir/jelopad.desktop \
            AppDir/usr/share/applications/jelopad.desktop

          # ------------------------------------------------------
          # Create AppRun
          # ------------------------------------------------------

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh

          HERE="$(dirname "$(readlink -f "$0")")"

          exec "$HERE/usr/bin/JeloPad" "$@"
          EOF

          chmod +x AppDir/AppRun

      # ----------------------------------------------------------
      # Verify AppDir before packaging
      # ----------------------------------------------------------

      - name: Verify AppDir
        run: |
          echo "=== AppDir ==="
          find AppDir -type f -o -type l | sort

          echo
          echo "=== Desktop file ==="
          cat AppDir/jelopad.desktop

          echo
          echo "=== AppRun ==="
          cat AppDir/AppRun

          echo
          echo "=== Executable ==="
          file AppDir/usr/bin/JeloPad

      # ----------------------------------------------------------
      # Download AppImage tool
      # ----------------------------------------------------------

      - name: Download appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

      # ----------------------------------------------------------
      # Build AppImage
      # ----------------------------------------------------------

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          ./appimagetool \
            AppDir \
            JeloPad-Linux-x64.AppImage

      # ----------------------------------------------------------
      # Verify AppImage
      # ----------------------------------------------------------

      - name: Verify AppImage
        run: |
          test -f "JeloPad-Linux-x64.AppImage"

          chmod +x "JeloPad-Linux-x64.AppImage"

          echo "=== AppImage ==="
          file "JeloPad-Linux-x64.AppImage"

          echo
          ls -lh "JeloPad-Linux-x64.AppImage"

      # ----------------------------------------------------------
      # Upload standalone Linux binary
      # ----------------------------------------------------------

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: JeloPad-Linux-x64-bin
          path: dist/JeloPad-Linux-x64

      # ----------------------------------------------------------
      # Upload Linux AppImage
      # ----------------------------------------------------------

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: JeloPad-Linux-x64-AppImage
          path: JeloPad-Linux-x64.AppImage