name: Build CLI Executables

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # WINDOWS
  # ============================================================
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: pygame
          python -m pip install websockets textual rich hidapi pyinstaller

      - name: Verify imports
        shell: bash
        run: |
          python -c "import pygame; print('pygame:', pygame.version.ver)"
          python -c "import websockets; print('websockets OK')"
          python -c "import textual; print('textual OK')"
          python -c "import rich; print('rich OK')"
          python -c "import hid; print('hidapi OK')"

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name "JeloPad-Windows-x64" \
            --collect-all pygame \
            --collect-all textual \
            --collect-all rich \
            cli.py

      - name: Test executable exists
        shell: bash
        run: |
          test -f dist/JeloPad-Windows-x64.exe
          ls -lh dist/JeloPad-Windows-x64.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: JeloPad-Windows-x64
          path: dist/JeloPad-Windows-x64.exe


  # ============================================================
  # LINUX
  # ============================================================
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            fuse \
            libfuse2 \
            file

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: |
          python -m pip install --only-binary=:all: pygame
          python -m pip install websockets textual rich hidapi pyinstaller

      - name: Verify imports
        run: |
          python -c "import pygame; print('pygame:', pygame.version.ver)"
          python -c "import websockets; print('websockets OK')"
          python -c "import textual; print('textual OK')"
          python -c "import rich; print('rich OK')"
          python -c "import hid; print('hidapi OK')"

      - name: Build Linux executable
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name "JeloPad-Linux-x64" \
            --collect-all pygame \
            --collect-all textual \
            --collect-all rich \
            cli.py

      - name: Make binary executable
        run: |
          chmod +x dist/JeloPad-Linux-x64

      - name: Verify Linux binary
        run: |
          file dist/JeloPad-Linux-x64
          ls -lh dist/JeloPad-Linux-x64

      # ----------------------------------------------------------
      # Create AppImage
      # ----------------------------------------------------------

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Download appimagetool
        run: |
          wget -O appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool.AppImage

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/JeloPad-Linux-x64 AppDir/usr/bin/JeloPad

          cat > AppDir/usr/share/applications/jelopad.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=JeloPad
          Comment=JeloPad PS4 controller bridge
          Exec=JeloPad
          Terminal=true
          Categories=Utility;
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/JeloPad" "$@"
          EOF

          chmod +x AppDir/AppRun

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/jelopad.desktop

          ./appimagetool.AppImage \
            AppDir \
            JeloPad-Linux-x64.AppImage

      - name: Verify AppImage
        run: |
          chmod +x JeloPad-Linux-x64.AppImage
          file JeloPad-Linux-x64.AppImage
          ls -lh JeloPad-Linux-x64.AppImage

      # ----------------------------------------------------------
      # Upload both Linux formats
      # ----------------------------------------------------------

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: JeloPad-Linux-x64-bin
          path: dist/JeloPad-Linux-x64

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: JeloPad-Linux-x64-AppImage
          path: JeloPad-Linux-x64.AppImage